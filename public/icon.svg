<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect width="512" height="512" rx="110" fill="url(#shine)" />
  
  <!-- Outer glowing ring / broadcast lines -->
  <circle cx="256" cy="180" r="110" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 12" opacity="0.3" />
  <circle cx="256" cy="180" r="75" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.6" />
  
  <!-- Newspaper / Broadcast Icon -->
  <path d="M190 140 H322 C330 140 338 148 338 156 V240 C338 248 330 256 322 256 H190 C182 256 174 248 174 240 V156 C174 148 182 140 190 140 Z" fill="#ffffff" />
  <rect x="200" y="160" width="50" height="40" rx="4" fill="#dc2626" />
  <line x1="265" y1="166" x2="315" y2="166" stroke="#dc2626" stroke-width="6" stroke-linecap="round" />
  <line x1="265" y1="184" x2="315" y2="184" stroke="#dc2626" stroke-width="6" stroke-linecap="round" />
  <line x1="200" y1="216" x2="315" y2="216" stroke="#dc2626" stroke-width="6" stroke-linecap="round" />
  <line x1="200" y1="234" x2="280" y2="234" stroke="#dc2626" stroke-width="6" stroke-linecap="round" />

  <!-- Live Pulse Dot -->
  <circle cx="340" cy="135" r="14" fill="#facc15" stroke="#ffffff" stroke-width="4" />

  <!-- Typography: DDN / DAMOH NEWS -->
  <text x="256" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="4">DAMOH</text>
  <text x="256" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="#fecaca" text-anchor="middle" letter-spacing="6">DAILY NEWS</text>
  <rect x="170" y="435" width="172" height="6" rx="3" fill="#facc15" />
</svg>
